; Walter Feels solar/LiFePO4 test node
;
; Jediná spoľahlivá cesta na nahratie firmvéru na zariadenie, ktoré je
; namontované a nie je k nemu fyzický prístup, je stránka /update
; (multipart upload, Update.h). ArduinoOTA/espota push sa zámerne
; nepridáva - pv-logger-c3 (sesterský projekt) má v README zdokumentované,
; že cez Windows Firewall zvykne zlyhať aj pri správnej autentifikácii.
;
;   pio run -e usb -t upload --upload-port COMx    prvé nahratie / bench test
;   (ďalej už len cez webové rozhranie na /update)

[platformio]
default_envs = usb

[env]
; POZOR: toto NIE JE oficiálny `platform = espressif32@X.Y.Z` z
; PlatformIO registra (ten zaostáva - najnovšia framework verzia v ňom
; zodpovedá zhruba koncu roka 2024 a nemá napr. LEDC API, ktoré
; src/WalterFeels.cpp potrebuje). Používa sa komunitný fork
; "pioarduino/platform-espressif32", ktorý sleduje vydania arduino-esp32
; oveľa tesnejšie a publikuje ich priamo pod zodpovedajúcim tagom -
; overené reálnym buildom, že tag 53.03.13 = presne "Arduino core 3.1.3
; based on IDF 5.3.2.250210", teda rovnaká verzia jadra, akú má lokálna
; Arduino IDE inštalácia použitá na prvé nahratie tohto zariadenia.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino

; FQBN esp32:esp32:walter (DPTechnics Walter/Walter Feels), MCU ESP32-S3.
; PlatformIO nemá vlastný "walter" board wrapper, preto sa berie generický
; esp32-s3-devkitc-1 a hardvérovo-špecifické veci (piny, partície) sa
; nastavujú explicitne nižšie.
board = esp32-s3-devkitc-1

; KRITICKÉ: core 3.2.0+ má potvrdenú regresiu v I2C ovládači
; (esp32-hal-i2c-ng), ktorá rozbije každú I2C transakciu na tejto doske
; (LTC4015, HDC1080, LPS22HB, SCD30 sú všetky na I2C) - viď
; espressif/arduino-esp32#11374, zdokumentované aj v README tohto
; projektu. Tag 53.03.13 vyššie je presne 3.1.3, teda pod hranicou 3.2.0.

; Rozdelenie flash s dvoma OTA slotmi + FAT oblasť - skopírované 1:1
; z lokálnej Arduino IDE inštalácie (Walter "16M Flash (2MB APP/12.5MB
; FATFS)" / "fatflash" menu položka), NIE ručne prepísané, aby presne
; sedeli hranice OTA slotov s tým, čo je už na zariadení vypálené.
board_build.partitions = ffat.csv
board_upload.flash_size = 16MB

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; WalterModem zámerne CHÝBA tu, aj ked ho src/main.cpp v celulárnej
; (#else) vetve pouziva - PlatformIO by inak skompilovalo VSETKY .cpp
; súbory tej kniznice bez ohladu na to, ci sa #include <WalterModem.h>
; v aktivnej #if vetve (TELEMETRY_TRANSPORT_WIFI=1, teda WiFi bring-up,
; momentálne jediný pouzivany rezim) vobec dosiahne. Najnovsia
; WalterModem@1.5.0 z registra pouziva spi_flash_mmap.h, ktoru IDF
; zabudovana v tomto pripnuti core-u nema (starsi esp_spi_flash.h) -
; build preto padal aj ked sa celularny kod vobec nepouzival. Kym Faza 5
; (dual-stack refaktor) skutocne zapoji celularny prenos, netreba to sem
; tahat - az vtedy treba doriesit spravnu kombinaciu platform/core verzie
; a WalterModem verzie, ktora ma obe hlavicky konzistentne.
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8

[env:usb]
upload_protocol = esptool
; over presné číslo COM portu pred prvým nahratím (bench test, dosky
; ešte nie je namontovaná) - potom už len cez /update
upload_port     = COM_TU_DOPLNIT
monitor_port    = COM_TU_DOPLNIT
